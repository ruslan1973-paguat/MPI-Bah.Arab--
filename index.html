const IMG='https://iili.io/nvQAj2e.md.jpg',TUJ='Murid mampu menganalisis kosa kata, pola kalimat dan wacana tentang التَّعَارُفُ berdasarkan keterampilan berbahasa untuk dapat digunakan dalam kehidupan sehari-hari dengan baik dan benar serta menunjukkan sikap menghargai sesama sebagai wujud cinta diri & sesama dengan baik.';
const A=[['يَا أَيُّهَا النَّاسُ إِنَّا خَلَقْنَاكُم مِّن ذَكَرٍ وَأُنثَىٰ وَجَعَلْنَاكُمْ شُعُوبًا وَقَبَائِلَ لِتَعَارَفُوا ۚ إِنَّ أَكْرَمَكُمْ عِندَ اللَّهِ أَتْقَاكُمْ','“Wahai manusia, sesungguhnya Kami menciptakan kamu dari seorang laki-laki dan seorang perempuan, kemudian Kami jadikan kamu berbangsa-bangsa dan bersuku-suku agar kamu saling mengenal. Sesungguhnya yang paling mulia di antara kamu di sisi Allah ialah orang yang paling bertakwa.” (Terjemah Kemenag RI)','QS. Al-Hujurat [49]: 13'],
['وَإِذَا حُيِّيتُم بِتَحِيَّةٍ فَحَيُّوا بِأَحْسَنَ مِنْهَا أَوْ رُدُّوهَا','“Apabila kamu dihormati dengan suatu penghormatan, balaslah dengan yang lebih baik, atau balaslah (dengan yang serupa).” (Terjemah Kemenag RI)','QS. An-Nisa’ [4]: 86'],

['Salam & Sapaan (التَّحِيَّةُ)','Ta’aruf dimulai dengan salam: السَّلَامُ عَلَيْكُمْ dijawab وَعَلَيْكُمُ السَّلَامُ. Sapaan waktu: صَبَاحُ الْخَيْرِ (selamat pagi) dijawab صَبَاحُ النُّورِ, dan مَسَاءُ الْخَيْرِ (selamat sore) dijawab مَسَاءُ النُّورِ. Membalas sapaan dengan lebih baik adalah adab Islam.','Di Paguat, di bawah bukit gunung, warga saling menyapa saat berpapasan di jalan menuju kebun; sapaan pagi berkabut itu mempererat kampung.','KBC: sapaan tulus adalah wujud cinta kepada sesama dan diri sendiri.','Arti مَسَاءُ الْخَيْرِ?',['Selamat pagi','Selamat sore','Selamat tidur','Sampai jumpa'],1],
['Kosakata Perkenalan (الْمُفْرَدَاتُ)','اِسْمٌ = nama; عُمْرٌ = umur; عُنْوَانٌ = alamat; قَرْيَةٌ = desa; صَدِيقٌ = teman; طَالِبٌ / طَالِبَةٌ = siswa / siswi; جَبَلٌ = gunung. Kosakata ini adalah “batu bata” untuk membangun kalimat perkenalan.','Murid MTs Al Khairaat Paguat dapat menyebut قَرْيَتِي تَحْتَ الْجَبَلِ — “desaku di bawah gunung”.','KBC: menyebut asal daerah dengan bangga adalah cinta tanah air dan lingkungan.','Arti قَرْيَةٌ?',['Gunung','Teman','Desa','Alamat'],2],
['Pola Kalimat Tanya–Jawab (الْجُمْلَةُ)','مَا اسْمُكَ؟ → اِسْمِي ... (siapa namamu → namaku ...). مِنْ أَيْنَ أَنْتَ؟ → أَنَا مِنْ ... (kamu dari mana → saya dari ...). كَمْ عُمْرُكَ؟ → عُمْرِي ... سَنَةً (berapa umurmu → umurku ... tahun).','Teman baru dari desa pesisir dan lereng bukit Paguat dapat saling bertanya memakai pola ini.','KBC: bertanya dengan santun menunjukkan kepedulian dan moderasi dalam bergaul.','Jawaban untuk مِنْ أَيْنَ أَنْتَ؟ adalah…',['اِسْمِي سَلْمَى','عُمْرِي ثَلَاثَ عَشْرَةَ سَنَةً','أَنَا مِنْ قَرْيَةٍ','وَعَلَيْكُمُ السَّلَامُ'],2],
['Kata Ganti (الضَّمَائِرُ)','أَنَا = saya; أَنْتَ = kamu (lk); أَنْتِ = kamu (pr); هُوَ = dia (lk); هِيَ = dia (pr); نَحْنُ = kami. Pilihan kata ganti harus sesuai jenis kelamin lawan bicara.','Contoh: هُوَ مِنْ قَرْيَةٍ تَحْتَ الْجَبَلِ، وَهِيَ مِنْ شَاطِئِ الْبَحْرِ.','KBC: menyebut orang lain dengan tepat adalah bentuk penghormatan.','Kata ganti untuk “dia perempuan”?',['هُوَ','أَنْتَ','هِيَ','أَنَا'],2],
['Wacana Percakapan (الْحِوَارُ)','رَحْمَةُ: السَّلَامُ عَلَيْكُمْ، مَا اسْمُكَ؟ — فَاضِلٌ: وَعَلَيْكُمُ السَّلَامُ، اِسْمِي فَاضِلٌ. — رَحْمَةُ: مِنْ أَيْنَ أَنْتَ؟ — فَاضِلٌ: أَنَا مِنْ قَرْيَةٍ تَحْتَ الْجَبَلِ. Perhatikan urutan: salam, nama, asal.','Dialog ini terjadi di halaman madrasah, saat kabut turun dari lereng bukit.','KBC: mendengar sebelum menjawab adalah wujud menghargai sesama.','Fadil berasal dari…',['Kota besar','Desa di bawah gunung','Pulau','Luar negeri'],1],
['Adab Ta’aruf & Keberagaman','Allah menjadikan manusia berbangsa dan bersuku agar saling mengenal (لِتَعَارَفُوا), bukan saling merendahkan. Kemuliaan diukur dari takwa, bukan asal daerah atau logat.','Murid pesisir dan lereng bukit Paguat saling melengkapi: yang satu menjaga laut, yang lain menjaga hutan dan mata air.','KBC: moderasi beragama, cinta sesama, serta menjaga bukit dan hutan sebagai amanah.','Tujuan Allah menciptakan manusia berbangsa-bangsa?',['Saling bersaing','Saling mengenal','Saling menjauh','Saling membedakan'],1]];

{t:'mc',s:'Allah berfirman dalam Al-Hujurat ayat 13 bahwa manusia dijadikan berbangsa-bangsa dan bersuku-suku. Di Paguat, ada murid dari lereng, dari pesisir, dan dari desa seberang sungai. Perbedaan itu bukan alasan berpecah.',q:'Makna لِتَعَارَفُوا adalah…',o:['agar saling bersaing','agar saling mengenal','agar saling menjauh','agar saling menang'],a:1,e:'لِتَعَارَفُوا = agar kamu saling mengenal.'},
{t:'order',s:'Khalid bertemu Salma di jalan menuju masjid, dekat kaki bukit. Mereka memulai dengan salam, lalu perkenalan. Susunlah percakapan sesuai adab yang benar.',q:'Urutkan dialog dari awal.',w:['السَّلَامُ عَلَيْكُمْ','وَعَلَيْكُمُ السَّلَامُ','مَا اسْمُكَ؟','اِسْمِي خَالِدٌ'],e:'Salam, jawab salam, tanya nama, jawab.'},
{t:'match',s:'Dalam kegiatan bakti kebersihan sungai di kaki bukit, murid menyebut siapa saja yang hadir: saya, dia laki-laki, dia perempuan, dan kamu. Memakai kata ganti yang tepat menunjukkan penghormatan.',q:'Jodohkan kata ganti.',p:[['أَنَا','Saya'],['هُوَ','Dia (lk)'],['هِيَ','Dia (pr)'],['أَنْتَ','Kamu (lk)']],e:'Dhamir munfashil.'},

{s:'Muhammad bertemu murid baru di gerbang madrasah Paguat. Ia bertanya: مَا اسْمُكَ؟ Murid itu menjawab: اِسْمِي يُوسُفُ.',q:'Fungsi kalimat مَا اسْمُكَ؟',o:['Menanyakan nama','Menanyakan umur','Menanyakan alamat','Mengucap salam'],a:0,e:'مَا = apa/siapa; اسْمُكَ = namamu.'},
{s:'Siti berasal dari desa pesisir dan kini belajar di madrasah di bawah bukit. Guru berkata: هِيَ طَالِبَةٌ جَدِيدَةٌ.',q:'Arti هِيَ طَالِبَةٌ جَدِيدَةٌ',o:['Dia siswa baru (lk)','Dia siswi baru','Kamu siswi baru','Saya siswi baru'],a:1,e:'هِيَ = dia perempuan.'},

{s:'Bapak Kepala Desa menjelaskan bahwa warga Paguat terdiri atas beragam suku dan latar. Ia mengutip QS. Al-Hujurat 13 agar warga saling mengenal dan tidak saling merendahkan.',q:'Fungsi keberagaman menurut ayat itu…',o:['Memisahkan kelompok','Sarana saling mengenal','Ukuran kemuliaan','Alasan berselisih'],a:1,e:'لِتَعَارَفُوا.'},
{s:'Rizki murid baru dari pesisir. Teman-temannya mengejek logat bicaranya saat ia memperkenalkan diri. Rizki menjadi pendiam. Ustazah mengingatkan bahwa kemuliaan di sisi Allah ada pada takwa dan bahwa kita diperintah berkata baik kepada sesama.',q:'Tindakan paling sesuai ayat dan nilai KBC…',o:['Membiarkan saja','Mengajak Rizki berkenalan dan meminta maaf atas ejekan','Menyuruh Rizki berhenti bicara','Mengganti kelompok Rizki'],a:1,e:'Menghargai sesama dan berkata baik (Al-Baqarah 83).'},
{s:'Banjir kecil dari sungai bukit merendam sebagian desa Paguat. Relawan dari desa lain datang dan memperkenalkan diri: السَّلَامُ عَلَيْكُمْ، نَحْنُ مِنْ قَرْيَةٍ أُخْرَى. Warga pun cepat bekerja sama.',q:'Kesimpulan terbaik dari kejadian ini…',o:['Perkenalan tak penting saat darurat','Saling kenal mempercepat gotong royong','Hanya warga asli boleh membantu','Salam menghambat kerja'],a:1,e:'Ta’aruf membangun kepercayaan dan kerja sama.'},
{s:'Madrasah mengundang 25% dari 40 murid kelas lain sebagai tamu. Setiap tamu memperkenalkan diri 1,5 menit. Waktu kegiatan ta’aruf tersedia 40 menit di kaki bukit Paguat yang sejuk.',q:'Berapa sisa waktu setelah semua tamu berkenalan?',o:['15 menit','20 menit','25 menit','30 menit'],a:2,e:'25%×40=10 tamu; 10×1,5=15; 40−15=25 menit.'}];
function modal(h,l){const m=document.createElement('div');m.className='mo';m.innerHTML=`<div class="c mc sp">${h}<p><button class=b>${l||'Kembali'}</button></p></div>`;m.querySelector('button').onclick=()=>m.remove();document.body.appendChild(m)}
const avt=`<div class=av>RD<img src="${IMG}" alt="Ruslan Daud" onerror="this.remove()"></div>`;
function splash(){R(`<div class="t sp" style="color:#fff;padding-top:25vh"><div style="font-size:4rem" class=fl>🤝</div><h1 class=ar style="color:#f2c94c;font-size:3rem">التعارف</h1><p>Memuat media pembelajaran…</p></div>`);setTimeout(cover,1900)}
function cover(){R(`<div class="c t"><span class=bd>Bahasa Arab • Kelas VII / Fase D • MTs</span><h1 class=ar style="font-size:3.2rem">التعارف</h1><svg viewBox="0 0 320 170" style="max-width:420px;width:100%"><rect width=320 height=170 rx=16 fill="#d1fae5"/><circle cx=265 cy=35 r=18 fill="#f2c94c"><animate attributeName=r values="18;21;18" dur=3s repeatCount=indefinite /></circle><path d="M0 130L70 55 130 120 190 45 260 130 320 100V170H0Z" fill="#047857"/><path d="M0 150L90 100 170 150 250 95 320 150V170H0Z" fill="#065f46"/><g class=fl><circle cx=110 cy=95 r=14 fill="#fcd9a8"/><rect x=96 y=109 width=28 height=36 rx=10 fill="#10b981"/><path d="M124 120L150 108" stroke="#fcd9a8" stroke-width=6 stroke-linecap=round /><circle cx=210 cy=95 r=14 fill="#e8b98a"/><rect x=196 y=109 width=28 height=36 rx=10 fill="#d4a017"/><path d="M196 120L170 108" stroke="#e8b98a" stroke-width=6 stroke-linecap=round /></g><text x=160 y=28 text-anchor=middle font-size=20 fill="#065f46" font-family=Amiri>السَّلَامُ عَلَيْكُمْ<animate attributeName=opacity values="1;.4;1" dur=2.5s repeatCount=indefinite /></text></svg>
<p><button class=b id=bi>👤 Informasi Pengembang</button><button class=b id=bt>🎯 Tujuan Pembelajaran</button></p><p><button class="b au" id=bm style="font-size:1.2rem">▶ MULAI</button></p></div>`);
$('#bi').onclick=()=>modal(`<h2>Informasi Pengembang</h2>${avt}<p><b>Ruslan Daud</b><br>MTsS Al Khairaat Paguat<br>daudruslan@gmail.com</p>`,'Kembali ke Cover');
$('#bt').onclick=()=>modal(`<h2>Tujuan Pembelajaran</h2><p style="text-align:left">${TUJ}</p>${av(0)}<p>💚 <i>Kurikulum Berbasis Cinta: cintai dirimu dan sesamamu, kenali mereka dengan hati.</i></p>`,'Kembali ke Cover');
$('#bm').onclick=form}
function form(){R(`<div class=c><h2>📝 Identitas Siswa</h2><label>Nama Lengkap</label><input id=fn><div class=er id=e1></div><label>Kelas</label><input id=fk placeholder="contoh: VII A"><div class=er id=e2></div><button class=b id=go>Lanjut ▶</button></div>`);
$('#go').onclick=()=>{const n=$('#fn').value.trim(),k=$('#fk').value.trim();$('#e1').textContent=n?'':'Nama wajib diisi.';$('#e2').textContent=k?'':'Kelas wajib diisi.';if(n&&k){S.n=n;S.k=k;intro(0)}}}
const GS=['🧭 Pilih menu secara berurutan: Belajar, lalu Bermain, lalu Berlatih. Menu terkunci akan terbuka otomatis.','👆 Jawab tantangan di tiap slide. Untuk drag & drop, seret kata atau cukup ketuk kata lalu ketuk kotaknya.','📄 Setelah Berlatih, lihat laporan hasil belajar dan unduh sebagai PDF.'];
function intro(i){R(`<div class=c><h2>Selamat Datang, ${S.n.replace(/</g,'&lt;')}! 🌿</h2><p>Media pembelajaran <b class=ar2>التعارف</b> siap menemanimu.</p><span class=bd>Panduan ${i+1}/3</span><p style="font-size:1.1rem">${GS[i]}</p><p><button class=b id=pv ${i?'':'disabled'}>◀ Kembali</button>${i<2?'<button class=b id=nx>Selanjutnya ▶</button>':'<button class="b au" id=mn>Masuk ke Menu Utama</button>'}</p></div>`);
$('#pv').onclick=()=>intro(i-1);if(i<2)$('#nx').onclick=()=>intro(i+1);else $('#mn').onclick=menu}
function menu(){const u1=S.ld.every(x=>x),u2=S.pd;R(`<div class=c><b>👤 ${S.n.replace(/</g,'&lt;')}</b> • Kelas ${S.k.replace(/</g,'&lt;')}<h2>Menu Utama</h2><div class=grid>
<div class=card id=m1><div style="font-size:2.5rem">📖</div><h3>BELAJAR</h3>🔓 Terbuka</div>
<div class="card ${u1?'':'lk'}" id=m2><div style="font-size:2.5rem">🎮</div><h3>BERMAIN</h3>${u1?'🔓 Terbuka':'🔒 Terkunci'}</div>
<div class="card ${u2?'':'lk'}" id=m3><div style="font-size:2.5rem">✍️</div><h3>BERLATIH</h3>${u2?'🔓 Terbuka':'🔒 Terkunci'}</div></div>${S.fin?'<p><button class=b id=lp>📄 Lihat Laporan</button></p>':''}</div>`);
$('#m1').onclick=()=>learn(0);$('#m2').onclick=()=>u1?play(0):modal('<h2>🔒 Menu Terkunci</h2><p>Selesaikan dulu seluruh 6 slide materi di menu BELAJAR untuk membuka BERMAIN.</p>');
$('#m3').onclick=()=>u2?pr(0):modal('<h2>🔒 Menu Terkunci</h2><p>Selesaikan 10 tantangan di menu BERMAIN untuk membuka BERLATIH.</p>');if(S.fin)$('#lp').onclick=rep}
function learn(i){const d=L[i];R(`<div class=c><span class=bd>Materi ${i+1}/6</span><h2>${d[0]}</h2><p class=ar2>${d[1]}</p><p>📍 <b>Konteks Paguat:</b> ${d[2]}</p><p>💚 ${d[3]}</p>${av(i%3)}<hr><b>Tantangan:</b> ${d[4]}<div id=q></div><div id=fb></div><p><button class=b id=pv>◀ Kembali</button><button class=b id=nx ${S.ld[i]?'':'disabled'}>${i<5?'Selanjutnya ▶':'Selesai ✔'}</button></p></div>`);
const q=$('#q');q.innerHTML=d[5].map((o,j)=>`<button class=opt data-j=${j}>${'ABCD'[j]}. ${o}</button>`).join('');
q.onclick=e=>{const b=e.target.closest('.opt');if(!b||q.dataset.l)return;const ok=+b.dataset.j==d[6];b.classList.add(ok?'ok':'no');$('#fb').innerHTML=ok?'✅ Benar! Barakallahu fiik.':'❌ Belum tepat, coba lagi.';if(ok){q.dataset.l=1;S.ld[i]=1;$('#nx').disabled=false}else setTimeout(()=>b.classList.remove('no'),700)};
$('#pv').onclick=()=>i?learn(i-1):menu();$('#nx').onclick=()=>{if(i<5)learn(i+1);else{menu();modal('<h2>🎉 Menu BERMAIN Terbuka!</h2><p>Kamu telah menuntaskan semua materi.</p>','Lanjut')}}}
function gameUI(g,x){const lk=()=>x.dataset.l;
if(g.t=='mc'||g.t=='mcc'){const m=g.t=='mcc',s=new Set();x.innerHTML=g.o.map((o,i)=>`<button class=opt data-i=${i}>${'ABCD'[i]}. ${o}</button>`).join('')+(m?'<small>Boleh memilih lebih dari satu.</small>':'');
x.onclick=e=>{const b=e.target.closest('.opt');if(!b||lk())return;const i=+b.dataset.i;if(m){s.has(i)?s.delete(i):s.add(i)}else{s.clear();s.add(i)}x.querySelectorAll('.opt').forEach((o,j)=>o.classList.toggle('on',s.has(j)))};
const a=m?g.a:[g.a];return{ready:()=>s.size>0,check:()=>s.size==a.length&&a.every(v=>s.has(v))}}
if(g.t=='match'){const r=sh(g.p.map(p=>p[1])),P2={};let c=null;const d=()=>{x.innerHTML=`<div class=mt><div>${g.p.map((p,i)=>`<button class="opt${c===i?' on':''}${P2[i]?' used':''}" data-l=${i}>${p[0]}${P2[i]?'<br>➜ '+P2[i]:''}</button>`).join('')}</div><div>${r.map((v,i)=>`<button class="opt${Object.values(P2).includes(v)?' used':''}" data-r=${i}>${v}</button>`).join('')}</div></div><small>Ketuk item kiri, lalu pasangannya di kanan.</small>`};d();
x.onclick=e=>{const b=e.target.closest('.opt');if(!b||lk())return;if(b.dataset.l!=null){const i=+b.dataset.l;delete P2[i];c=i;d()}else if(c!=null){const v=r[+b.dataset.r];if(Object.values(P2).includes(v))return;P2[c]=v;c=null;d()}};
return{ready:()=>Object.keys(P2).length==g.p.length,check:()=>g.p.every((p,i)=>P2[i]==p[1])}}
if(g.t=='order'){const pool=sh(g.w),ch=[];const d=()=>{x.innerHTML=`<div class=sl2>${ch.map(w=>`<button class=chip data-c="${w}">${w}</button>`).join('')||'<i style="direction:ltr">Ketuk kata di bawah secara berurutan…</i>'}</div><div class=pool>${pool.filter(w=>!ch.includes(w)).map(w=>`<button class="chip g" data-p="${w}">${w}</button>`).join('')}</div>`};d();
x.onclick=e=>{const b=e.target.closest('.chip');if(!b||lk())return;if(b.dataset.p!=null)ch.push(b.dataset.p);else ch.splice(ch.indexOf(b.dataset.c),1);d()};
return{ready:()=>ch.length==g.w.length,check:()=>ch.join('|')==g.w.join('|')}}
const F=g.a.map(()=>null);let c=null;const d=()=>{x.innerHTML=`<p class=ar2 style="direction:rtl">${g.b.replace(/\{(\d)\}/g,(m,i)=>`<span class=sl data-s=${i}>${F[i]||'＿＿＿'}</span>`)}</p><div class=pool>${g.c.filter(v=>!F.includes(v)).map(v=>`<button class="chip g${c===v?' on':''}" draggable=true data-p="${v}">${v}</button>`).join('')}</div><small>Seret kata ke kotak, atau ketuk kata lalu ketuk kotak.</small>`};d();
x.onclick=e=>{if(lk())return;const s=e.target.closest('.sl'),b=e.target.closest('.chip');if(b){c=b.dataset.p;d()}else if(s){const i=+s.dataset.s;if(c){F[i]=c;c=null}else F[i]=null;d()}};
x.ondragstart=e=>e.dataTransfer.setData('text/plain',e.target.dataset.p||'');x.ondragover=e=>e.preventDefault();
x.ondrop=e=>{const s=e.target.closest('.sl');if(!s||lk())return;e.preventDefault();F[+s.dataset.s]=e.dataTransfer.getData('text/plain');d()};
return{ready:()=>F.every(v=>v),check:()=>F.every((v,i)=>v==g.a[i])}}
function play(i){if(i>=10){S.pd=1;return R(`<div class="c t"><h2>🏁 Rekap Bermain</h2><p style="font-size:2rem"><b>${S.ps}</b>/100</p><p>Akurasi: ${S.pa*10}% (${S.pa} dari 10 benar)</p><p>🎉 Menu BERLATIH terbuka!</p><button class=b id=mn>Menu Utama</button></div>`),$('#mn').onclick=menu}
const g=G[i];if(!i){S.ps=0;S.pa=0}R(`<div class=c><span class=bd>Tantangan ${i+1}/10 • ${TY[g.t]}</span><p class=st>${g.s}</p><p><b>${g.q}</b></p><div id=bx></div><div id=fb></div><p><button class=b id=ck>Periksa</button></p></div>`);
const u=gameUI(g,$('#bx')),k=$('#ck');k.onclick=()=>{if(k.dataset.d)return play(i+1);if(!u.ready()){$('#fb').innerHTML='⚠️ Lengkapi jawabanmu dulu.';return}const ok=u.check();if(ok){S.ps+=10;S.pa++}$('#fb').innerHTML=(ok?'✅ Benar! +10 poin. ':'❌ Kurang tepat. ')+g.e;k.dataset.d=1;k.textContent=i<9?'Lanjut ▶':'Lihat Rekap';$('#bx').dataset.l=1}}
function pr(i){if(i>=10){S.fin=1;return rep()}const q=P[i],lv=i<3?1:i<7?2:3,w=[8,10,12][lv-1];let sel=-1;
R(`<div class=c><span class=bd>Soal ${i+1}/10</span> <span class=bd style="background:${['#10b981','#d4a017','#dc2626'][lv-1]}">Level ${lv} • ${['Dasar','Sedang','HOTS'][lv-1]} • ${w} poin</span><p class=st>${q.s}</p><p><b>${q.q}</b></p><div id=bx></div><div id=fb class=er></div><button class=b id=ck>${i<9?'Simpan & Lanjut ▶':'Selesai'}</button></div>`);
const x=$('#bx');x.innerHTML=q.o.map((o,j)=>`<button class=opt data-i=${j}>${'ABCD'[j]}. ${o}</button>`).join('');
x.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;sel=+b.dataset.i;x.querySelectorAll('.opt').forEach((o,j)=>o.classList.toggle('on',j==sel))};
$('#ck').onclick=()=>{if(sel<0){$('#fb').textContent='Pilih salah satu jawaban dahulu.';return}S.pr[i]=sel;pr(i+1)}}
function rep(){
  let sc=0,lv=[[0,0],[0,0],[0,0]],bnr=0,slh=0,dt=[];
  P.forEach((q,i)=>{
    const l=i<3?0:i<7?1:2,w=[8,10,12][l];
    lv[l][1]+=w;
    if(S.pr[i]==q.a){
      sc+=w;lv[l][0]+=w;bnr++;
      dt.push(`Benar (Jawab: ${q.o[S.pr[i]]})`);
    }else{
      slh++;
      const j=S.pr[i]>=0?q.o[S.pr[i]]:"Kosong";
      dt.push(`Salah (Jawab: ${j} | Kunci: ${q.o[q.a]})`);
    }
  });
  
  const pre=sc>=90?'A (Sangat Baik)':sc>=75?'B (Baik)':sc>=60?'C (Cukup)':'D (Perlu Bimbingan)',rc=sc>=75?'Pertahankan semangatmu; jadilah teman sebaya bagi yang masih belajar.':sc>=60?'Ulangi materi pola kalimat dan kata ganti, lalu latihan berpasangan.':'Ulangi seluruh materi Belajar dan Bermain dengan pendampingan guru.',e=t=>t.replace(/</g,'&lt;');
  
  R(`<div class=c id=rp><div class=t>${avt}<h2>MEDIA PEMBELAJARAN INTERAKTIF <span class=ar2>التعارف</span></h2><small>Bahasa Arab • Kelas VII / Fase D • Pengembang: Ruslan Daud — MTsS Al Khairaat Paguat (daudruslan@gmail.com)</small></div><hr>
  <table><tr><td>Nama</td><td>${e(S.n)}</td></tr><tr><td>Kelas</td><td>${e(S.k)}</td></tr><tr><td>Tanggal</td><td>${new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}</td></tr>
  <tr><td>Skor Bermain</td><td>${S.ps}/100 • Akurasi ${S.pa*10}%</td></tr><tr><td><b>Nilai Berlatih</b></td><td><b>${sc}/100 • Predikat ${pre}</b></td></tr>
  ${lv.map((l,i)=>`<tr><td>Penguasaan Level ${i+1}${i==2?' (HOTS)':''}</td><td>${Math.round(l[0]/l[1]*100)}% (${l[0]}/${l[1]} poin)</td></tr>`).join('')}</table>
  <p>💚 <b>Catatan KBC:</b> Teruslah mengenal dan menghargai sesama, mencintai diri, tanah air, dan alam di bawah bukit Paguat.</p><p>🧑‍🏫 <b>Rekomendasi Guru:</b> ${rc}</p>
  <div id=svs class=np style="text-align:center;font-weight:bold;color:var(--au);margin:10px 0"></div>
  <p class=np><button class=b id=pd>⬇ Unduh PDF</button><button class=b id=pt>🖨 Cetak</button><button class="b au" id=mn>Menu Utama</button></p></div>`);
  
  $('#pd').onclick=()=>window.html2pdf?html2pdf().from($('#rp')).save('Laporan-Taaruf-'+S.n.replace(/\s+/g,'_')+'.pdf'):print();
  $('#pt').onclick=()=>print();
  $('#mn').onclick=menu;

  // --- KODE TERHUBUNG KE DATABASE (GAS) ---
  if(GAS_URL && GAS_URL !== "URL_GAS_ANDA_DISINI"){
    $('#svs').innerHTML = "⏳ Menyimpan hasil ke database...";
    
    // Siapkan data soal untuk direkam (hanya akan direkam jika sheet Data Soal masih kosong di backend)
    const ds=[];
    G.forEach(g => ds.push({m:"Bermain", t:TY[g.t], s:g.s, q:g.q, o:g.o?g.o.join(" | "): (g.p?g.p.map(x=>x[0]+"-"+x[1]).join(" | "): (g.w?g.w.join(" | "):"")), a:g.e}));
    P.forEach(p => ds.push({m:"Berlatih", t:"Pilihan Ganda", s:p.s, q:p.q, o:p.o.join(" | "), a:p.o[p.a]}));
    
    // Kirim fetch POST text/plain untuk bypass preflight CORS
    fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ nama: S.n, kelas: S.k, skor_brm: S.ps, skor_lth: sc, bnr: bnr, slh: slh, detail: dt, soal: ds })
    })
    .then(r => r.json())
    .then(r => { $('#svs').innerHTML = "<span style='color:var(--g2)'>✅ Data berhasil disimpan.</span>"; })
    .catch(e => { $('#svs').innerHTML = "<span style='color:#dc2626'>⚠️ Gagal menyimpan data. Cek URL GAS.</span>"; });
  }
}
splash();
</script></body></html>
